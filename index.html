<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="icon" type="image/png" href="ctech-logo.png">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>C-TECH AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 95%;
            max-width: 900px;
            height: 90vh;

            background: #111827;

            border-radius: 18px;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            box-shadow:
                0 0 30px rgba(0,0,0,0.5);
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            padding: 15px 20px;

            background: #1e293b;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;

            font-size: 24px;
            font-weight: bold;

            text-align: center;
        }

        .logo {
            width: 55px;
            height: 55px;

            object-fit: contain;
        }

        /* =========================
           CHAT
        ========================= */

        .chat {
            flex: 1;

            overflow-y: auto;

            padding: 20px;
        }

        .message {
            max-width: 80%;

            padding: 14px 18px;

            margin-bottom: 15px;

            border-radius: 15px;

            line-height: 1.5;

            white-space: pre-wrap;

            word-wrap: break-word;
        }

        .user {
            background: #2563eb;

            margin-left: auto;
        }

        .ai {
            background: #334155;

            margin-right: auto;
        }

        .typing {
            opacity: 0.7;

            font-style: italic;
        }

        /* =========================
           INPUT AREA
        ========================= */

        .input-area {
            display: flex;

            gap: 10px;

            padding: 15px;

            background: #1e293b;
        }

        input {
            flex: 1;

            padding: 15px;

            border: none;

            outline: none;

            border-radius: 10px;

            font-size: 16px;
        }

        button {
            padding: 15px 20px;

            border: none;

            border-radius: 10px;

            background: #2563eb;

            color: white;

            cursor: pointer;

            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #64748b;

            cursor: not-allowed;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .app {
                width: 100%;

                height: 100vh;

                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }

            .input-area {
                flex-wrap: wrap;
            }

            input {
                width: 100%;

                flex-basis: 100%;
            }

            button {
                flex: 1;
            }
        }

    </style>

</head>


<body>

<div class="app">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <img
            src="ctech-logo.png"
            class="logo"
            alt="C-TECH Logo"
        >

        <span>C-TECH AI</span>

    </div>


    <!-- =========================
         CHAT
    ========================== -->

    <div
        class="chat"
        id="chat"
    >

        <div class="message ai">

            Hello! 👋 Main C-TECH AI hoon.

            Mujhse kuch bhi poochho!

        </div>

    </div>


    <!-- =========================
         INPUT
    ========================== -->

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="Ask anything..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>


</div>


<script>


// ==========================================
// ELEMENTS
// ==========================================

const input =
    document.getElementById("messageInput");

const chat =
    document.getElementById("chat");

const sendButton =
    document.getElementById("sendButton");


// ==========================================
// ADD MESSAGE
// ==========================================

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;

    return message;
}


// ==========================================
// ENTER KEY
// ==========================================

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


// ==========================================
// STREAMING CHAT
// ==========================================

async function sendMessage() {

    const message =
        input.value.trim();


    // Empty message
    if (!message) {

        return;

    }


    // ======================================
    // SHOW USER MESSAGE
    // ======================================

    addMessage(
        message,
        "user"
    );


    input.value = "";


    // Disable button
    sendButton.disabled =
        true;


    sendButton.textContent =
        "Thinking...";


    // ======================================
    // CREATE AI MESSAGE
    // ======================================

    const aiMessage =
        document.createElement("div");

    aiMessage.className =
        "message ai";


    aiMessage.textContent =
        "C-TECH AI is typing...";


    chat.appendChild(
        aiMessage
    );


    chat.scrollTop =
        chat.scrollHeight;


    try {


        // ==================================
        // SEND REQUEST
        // ==================================

        const response =
            await fetch(
                "/api/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            message: message
                        })

                }
            );


        // ==================================
        // ERROR CHECK
        // ==================================

        if (!response.ok) {

            let errorMessage =
                "Something went wrong.";


            try {

                const errorData =
                    await response.json();


                errorMessage =
                    errorData.error ||
                    errorMessage;


                console.error(
                    "Server error:",
                    errorData
                );

            }

            catch (error) {

                console.error(
                    "Could not read error:",
                    error
                );

            }


            throw new Error(
                errorMessage
            );

        }


        // ==================================
        // STREAM CHECK
        // ==================================

        if (!response.body) {

            throw new Error(
                "Streaming is not supported."
            );

        }


        // ==================================
        // CREATE STREAM READER
        // ==================================

        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder("utf-8");


        let buffer =
            "";

        let fullAnswer =
            "";


        // Remove typing message

        aiMessage.textContent =
            "";


        sendButton.textContent =
            "Generating...";


        // ==================================
        // READ STREAM
        // ==================================

        while (true) {


            const result =
                await reader.read();


            const value =
                result.value;


            const done =
                result.done;


            if (done) {

                break;

            }


            // Decode incoming data

            buffer +=
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            // SSE events
            const events =
                buffer.split("\n\n");


            // Keep unfinished event

            buffer =
                events.pop() || "";


            // ==================================
            // PROCESS EVENTS
            // ==================================

            for (
                const event of events
            ) {


                const lines =
                    event.split("\n");


                for (
                    const line of lines
                ) {


                    if (
                        !line.startsWith("data:")
                    ) {

                        continue;

                    }


                    const jsonText =
                        line
                            .replace(
                                /^data:\s*/,
                                ""
                            )
                            .trim();


                    if (!jsonText) {

                        continue;

                    }


                    try {


                        const data =
                            JSON.parse(
                                jsonText
                            );


                        const text =
                            data
                                ?.candidates?.[0]
                                ?.content?.parts?.[0]
                                ?.text;


                        if (text) {


                            fullAnswer +=
                                text;


                            aiMessage.textContent =
                                fullAnswer;


                            chat.scrollTop =
                                chat.scrollHeight;

                        }

                    }


                    catch (error) {

                        console.log(
                            "Stream parsing:",
                            error
                        );

                    }

                }

            }

        }


        // ==================================
        // EMPTY RESPONSE
        // ==================================

        if (!fullAnswer.trim()) {

            aiMessage.textContent =
                "C-TECH AI ne koi response nahi diya.";

        }

    }


    // ======================================
    // ERROR
    // ======================================

    catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );


        aiMessage.textContent =
            "❌ Error: " +
            error.message;

    }


    // ======================================
    // RESET BUTTON
    // ======================================

    finally {

        sendButton.disabled =
            false;


        sendButton.textContent =
            "Send";


        input.focus();

    }

}


</script>


</body>

</html>
